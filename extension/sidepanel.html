<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BossCopilot</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --line: #e8ebf0;
        --text: #1b1f24;
        --muted: #6b7280;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --ok: #15a05a;
        --warn: #d97706;
        --bad: #dc2626;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; min-height: 100%; }

      body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        padding: 14px 16px 12px;
        background: rgba(246, 247, 249, 0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 10px;
      }

      .brand h1 {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.2px;
      }

      .brand span {
        font-size: 11px;
        color: var(--muted);
      }

      .btn {
        width: 100%;
        height: 40px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.2px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: background 0.15s ease, transform 0.05s ease;
      }

      .btn:hover:not(:disabled) { background: var(--primary-dark); }
      .btn:active:not(:disabled) { transform: translateY(1px); }
      .btn:disabled { opacity: 0.65; cursor: default; }

      .btn.loading::before {
        content: "";
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255, 255, 255, 0.45);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      main { padding: 14px 16px 28px; }

      .status {
        margin: 0 0 12px;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 12.5px;
        line-height: 1.55;
        border: 1px solid transparent;
        word-break: break-word;
      }

      .status.info { background: #eef4ff; border-color: #dbe6ff; color: #24468f; }
      .status.warn { background: #fff7ea; border-color: #ffe6bf; color: #8a5a12; }
      .status.error { background: #fdeeee; border-color: #f8d4d4; color: #a12626; }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }

      .jobline {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }

      .jobline strong { font-size: 13.5px; }

      .badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #eef2f7;
        color: var(--muted);
      }

      .score {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .ring {
        --p: 0;
        --ring-color: var(--ok);
        width: 84px;
        height: 84px;
        flex: none;
        border-radius: 50%;
        display: grid;
        place-items: center;
        position: relative;
        background: conic-gradient(var(--ring-color) calc(var(--p) * 1%), #e9edf3 0);
      }

      .ring::after {
        content: "";
        position: absolute;
        inset: 7px;
        background: #fff;
        border-radius: 50%;
      }

      .ring b {
        position: relative;
        z-index: 1;
        font-size: 26px;
        line-height: 1;
        color: var(--ring-color);
        font-variant-numeric: tabular-nums;
      }

      .score-meta h2 { margin: 0 0 3px; font-size: 14px; }
      .score-meta p { margin: 0; font-size: 12px; color: var(--muted); }

      .block { margin-top: 16px; }

      .block h3 {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--muted);
      }

      ul.list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      ul.list li {
        display: flex;
        gap: 8px;
        font-size: 13px;
        line-height: 1.6;
      }

      .mark {
        flex: none;
        width: 18px;
        height: 18px;
        margin-top: 2px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
      }

      .mark.ok { background: #e8f7ef; color: #12804a; }
      .mark.warn { background: #fff4e5; color: #b45309; }

      .greet {
        position: relative;
        padding: 12px;
        margin-bottom: 8px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
      }

      .greet p {
        margin: 0;
        padding-right: 54px;
        font-size: 13px;
        line-height: 1.65;
        word-break: break-word;
      }

      .copy {
        position: absolute;
        top: 8px;
        right: 8px;
        font-size: 11.5px;
        padding: 3px 9px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: #f8fafc;
        color: var(--muted);
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .copy:hover { background: #eef2f7; color: var(--text); }
      .copy.copied { border-color: #bfe6d0; background: #e8f7ef; color: #12804a; }

      .meta {
        margin-top: 10px;
        font-size: 11.5px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <h1>BossCopilot</h1>
        <span>JD 匹配助手</span>
      </div>
      <button id="analyzeBtn" class="btn" type="button">分析当前岗位</button>
    </div>

    <main>
      <p id="status" class="status info">
        在 Boss 直聘岗位详情页点上方按钮；若抓不到内容，先用鼠标选中 JD 文本再点一次。
      </p>

      <section id="result" hidden>
        <div class="jobline">
          <strong id="jobTitle"></strong>
          <span id="sourceBadge" class="badge"></span>
        </div>

        <div class="card score">
          <div id="ring" class="ring"><b id="score">0</b></div>
          <div class="score-meta">
            <h2 id="scoreLabel"></h2>
            <p>岗位匹配度</p>
          </div>
        </div>

        <section class="block">
          <h3>匹配优势</h3>
          <ul id="pros" class="list"></ul>
        </section>

        <section class="block">
          <h3>短板与缺口</h3>
          <ul id="gaps" class="list"></ul>
        </section>

        <section class="block">
          <h3>打招呼语</h3>
          <div id="greetings"></div>
          <p id="meta" class="meta"></p>
        </section>
      </section>
    </main>

    <script src="sidepanel.js"></script>
  </body>
</html>
